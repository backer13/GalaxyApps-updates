    min-height: 44px;

  .form-range {

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;

   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */

    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||

#galaxybar-app-demo .gb-grid .gb-preset-icon {width:29px;height:29px}
#galaxybar-app-demo .gb-segments.gb-folder-icons {display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
#galaxybar-app-demo .gb-pop h2 {font-size:16px;margin:0 0 8px}
#galaxybar-app-demo .gb-pop-items {display:grid;gap:5px}
#galaxybar-app-demo .gb-grid .gb-pop-items {grid-template-columns:repeat(var(--folder-columns,3),minmax(0,1fr))}
#galaxybar-app-demo .gb-grid .gb-pop-items button {min-height:var(--folder-tile-height,64px)}
#galaxybar-app-demo .gb-grid .gb-pop-items button &gt; :is(.gb-icon,.gb-symbol,.gb-seat-icon,.gb-preset-icon) {width:var(--folder-icon-size,27px);height:var(--folder-icon-size,27px);min-width:var(--folder-icon-size,27px);flex:none;font-size:var(--folder-icon-size,27px)}
#galaxybar-app-demo .gb-grid .gb-pop-items .gb-symbol svg {width:100%;height:100%}
#galaxybar-app-demo :is(.gb-grid,.gb-draft-grid) .gb-preset-icon &gt; .gb-icon {width:70.83%;height:70.83%}
#galaxybar-app-demo .gb-pop-items button {display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--gb-tile);border-radius:7px;min-height:34px;text-align:left;overflow-wrap:anywhere}
#galaxybar-app-demo .gb-grid .gb-pop-items button {flex-direction:column;justify-content:center;text-align:center;min-height:var(--folder-tile-height,64px);height:var(--folder-tile-height,64px);font-size:12px;padding:5px}
#galaxybar-app-demo .gb-grid .gb-folder-caption {display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#galaxybar-app-demo .gb-folder-copy {min-width:0;flex:1}
#galaxybar-app-demo .gb-folder-caption {display:block;line-height:1.25}
#galaxybar-app-demo .gb-folder-state {display:block;color:var(--gb-muted);font-size:11px;line-height:14px;min-height:14px;margin-top:2px}
#galaxybar-app-demo .gb-grid .gb-folder-copy {flex:none;width:100%}
#galaxybar-app-demo .gb-grid .gb-pop-items &gt; button.gb-function-tile {height:calc(var(--folder-tile-height,64px) + 30px);min-height:calc(var(--folder-tile-height,64px) + 30px)}
#galaxybar-app-demo .gb-grid .gb-function-tile .gb-folder-caption {min-height:28px;line-height:14px;flex:none}
#galaxybar-app-demo .gb-grid .gb-icon {width:29px;height:29px}
#galaxybar-app-demo .gb-dialog {color:var(--gb-text);background:var(--gb-card);border:0;border-radius:14px;padding:17px;width:min(460px,calc(100% - 26px));max-height:85vh;box-shadow:0 14px 40px #0006}
#galaxybar-app-demo .gb-dialog[data-folder-editor] {width:min(var(--folder-editor-width,460px),calc(100% - 26px))}
#galaxybar-app-demo .gb-dialog::backdrop {background:#080e14a0}
#galaxybar-app-demo .gb-dialog[data-release-notes] {width:min(740px,calc(100% - 32px));padding:22px 24px 16px}
#galaxybar-app-demo .gb-dialog[data-release-notes] &gt; h2 {display:none}
#galaxybar-app-demo .gb-dialog[data-release-notes] &gt; .gb-actions button {min-width:140px;min-height:44px}
#galaxybar-app-demo .gb-release-history {min-width:0}
#galaxybar-app-demo main .gb-release-history {margin-top:26px}
#galaxybar-app-demo .gb-release-header {display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--gb-line)}
#galaxybar-app-demo .gb-release-header h3 {margin:0;color:var(--gb-text);font-size:21px}
#galaxybar-app-demo .gb-release-history time {color:var(--gb-muted);font-size:13px}
#galaxybar-app-demo .gb-release-current {display:grid;grid-template-columns:minmax(105px,25%) minmax(0,1fr);gap:12px;margin:12px 0}
#galaxybar-app-demo .gb-release-current section,#galaxybar-app-demo .gb-release-number {background:var(--gb-tile);border-radius:9px;padding:12px 14px}
#galaxybar-app-demo .gb-release-number {display:grid;align-content:center;border-inline-start:3px solid var(--gb-accent);font-size:42px;font-weight:500;line-height:1.1}
#galaxybar-app-demo .gb-release-history h4 {font-size:16px;margin:0 0 4px;font-weight:500}
#galaxybar-app-demo .gb-release-history p {color:var(--gb-muted);white-space:pre-line}
#galaxybar-app-demo .gb-release-history details {border-bottom:1px solid var(--gb-line)}
#galaxybar-app-demo .gb-release-history details p {padding-bottom:10px}
#galaxybar-app-demo .gb-release-history summary {display:flex;align-items:center;gap:9px;cursor:pointer;min-height:43px}
#galaxybar-app-demo .gb-release-history summary time {margin-left:auto}
#galaxybar-app-demo .gb-release-history summary::after {content:&#x27;⌄&#x27;;color:var(--gb-muted)}
#galaxybar-app-demo .gb-release-history details[open] summary::after {transform:rotate(180deg)}
@container (max-width:470px) {
  #galaxybar-app-demo .gb-release-current {grid-template-columns:minmax(75px,26%) minmax(0,1fr);gap:7px}
  #galaxybar-app-demo .gb-release-number {font-size:26px;padding:8px}
  #galaxybar-app-demo .gb-dialog[data-release-notes] {padding:14px}
}
#galaxybar-app-demo .gb-dialog[data-forecast-help] {
  position:fixed;inset:var(--gb-help-top) auto auto var(--gb-help-left);margin:0;
  width:var(--gb-help-width);max-height:var(--gb-help-height);background:var(--gb-tile);
}
#galaxybar-app-demo .gb-dialog[data-forecast-help]::backdrop {background:transparent}
#galaxybar-app-demo .gb-dialog[data-forecast-help] .gb-dialog-body p + p {margin-top:10px}
#galaxybar-app-demo .gb-dialog[data-forecast-help] .gb-control {width:100%}
#galaxybar-app-demo .gb-dialog[open] {display:flex;flex-direction:column;overflow:hidden}
#galaxybar-app-demo .gb-dialog h2 {font-size:20px;margin:0 0 10px;flex:none}
#galaxybar-app-demo .gb-dialog-body {min-height:0;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain}
#galaxybar-app-demo .gb-dialog &gt; .gb-actions {flex:none}
#galaxybar-app-demo .gb-folder-fields {padding-bottom:12px;border-bottom:1px solid var(--gb-line)}
#galaxybar-app-demo .gb-dialog .gb-actions {justify-content:flex-end;margin:13px 0 0}
#galaxybar-app-demo .gb-panel-gap {margin-top:9px}
#galaxybar-app-demo .gb-toast {position:absolute;z-index:3;bottom:51px;left:50%;transform:translateX(-50%);padding:8px 12px;background:var(--gb-tile);border-radius:8px;width:max-content;max-width:92%}
#galaxybar-app-demo .gb-qr {width:min(145px,100%);margin:10px 0}
#galaxybar-app-demo .gb-layout {display:grid;grid-template-columns:22% minmax(0,44%) 1fr;grid-template-rows:minmax(0,1fr);block-size:597px;position:relative;isolation:isolate}
@container (max-width:700px) {
  #galaxybar-app-demo .gb-layout {grid-template-columns:31% minmax(0,69%)}
  #galaxybar-app-demo .gb-layout::before {opacity:.25}
  #galaxybar-app-demo .gb-system {display:none}
}
@container (max-width:470px) {
  #galaxybar-app-demo .gb-layout {grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);block-size:560px}
  #galaxybar-app-demo .gb-layout::before {display:none}

  #galaxybar-app-demo aside {padding:0}
  #galaxybar-app-demo .gb-brand {padding-bottom:6px}
  #galaxybar-app-demo nav {grid-template-columns:repeat(2,minmax(0,1fr));padding:0 5px}
  #galaxybar-app-demo nav button {min-height:35px;padding:3px 6px;font-size:12px}
  #galaxybar-app-demo main {padding:12px}
  #galaxybar-app-demo .gb-dock {font-size:11px;min-height:49px;grid-template-columns:35% repeat(2,8%) 16% repeat(4,8.25%)}
  #galaxybar-app-demo .gb-home {gap:4px;padding-left:4px}
  #galaxybar-app-demo .gb-home-ring {width:13px;height:13px;border-width:2px}
  #galaxybar-app-demo .gb-now-playing {display:none}
  #galaxybar-app-demo :is(.gb-dock-icon,.gb-dock-climate) svg {width:16px!important;height:16px!important}
  #galaxybar-app-demo .gb-dock-climate {font-size:13px}
  #galaxybar-app-demo :is(.gb-dock-seat,.gb-dock-demister,.gb-dock-wash) {transform:scale(.62)}
  #galaxybar-app-demo .gb-dock-passenger {transform:scale(-.62,.62)}
  #galaxybar-app-demo .gb-top {gap:4px;padding-inline:7px}
  #galaxybar-app-demo .gb-avatar {width:22px;height:22px;margin:0}
  #galaxybar-app-demo :is(.gb-shield,.gb-wireless) {width:21px}
  #galaxybar-app-demo .gb-wireless &gt; span {width:19px}
  #galaxybar-app-demo .gb-shortcuts {gap:3px;flex-wrap:wrap}
}

#galaxybar-app-demo[data-theme=&quot;light&quot;] .gb-layout::before {opacity:.29;filter:saturate(.65)}
#galaxybar-app-demo .gb-actions.gb-two {display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
#galaxybar-app-demo .gb-draft-grid {display:grid;grid-template-columns:repeat(var(--folder-columns,3),minmax(0,1fr));width:min(100%,var(--folder-grid-width,352px));gap:8px;margin:8px auto 0}
#galaxybar-app-demo .gb-draft-grid .gb-draft-item {height:var(--folder-tile-height,96px);min-height:var(--folder-tile-height,96px);min-width:0;padding:8px 5px;overflow:hidden}
#galaxybar-app-demo .gb-draft-item &gt; :is(.gb-icon,.gb-symbol,.gb-seat-icon,.gb-preset-icon) {width:var(--folder-icon-size,40px);height:var(--folder-icon-size,40px);min-width:var(--folder-icon-size,40px);font-size:var(--folder-icon-size,40px)}
#galaxybar-app-demo .gb-draft-grid .gb-symbol svg {width:100%;height:100%}
#galaxybar-app-demo .gb-draft-grid .gb-draft-item &gt; .gb-folder-caption {display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:100%;line-height:14px;max-height:28px;overflow:hidden;text-overflow:ellipsis}
#galaxybar-app-demo .gb-draft-item {position:relative;display:grid;place-content:center;justify-items:center;gap:5px;min-height:94px;padding:23px 5px 8px;background:var(--gb-tile);border-radius:9px;text-align:center;font-size:12px;touch-action:none;cursor:grab;user-select:none}
#galaxybar-app-demo .gb-draft-item img {pointer-events:none}
#galaxybar-app-demo .gb-draft-item button {touch-action:manipulation}
#galaxybar-app-demo .gb-draft-item .gb-draft-remove {position:absolute;top:0;right:0;min-width:32px;min-height:32px;color:var(--gb-accent)}
#galaxybar-app-demo .gb-draft-item.gb-drag-target {outline:2px solid var(--gb-accent);outline-offset:-2px}
@container (max-width:470px) { #galaxybar-app-demo .gb-actions.gb-two {grid-template-columns:1fr} }

#galaxybar-app-demo .gb-version {font-size:11px;white-space:nowrap}
#galaxybar-app-demo .gb-shield {align-self:stretch}
#galaxybar-app-demo :is(.gb-shortcuts,.gb-widget-preview) .gb-meter {display:inline-flex;align-items:center;flex:none;gap:4px;min-height:24px;height:max(calc(var(--gb-icon-height) * .82),calc(var(--meter-number-size,12px) + 4px));padding:0 7px;border-radius:999px;white-space:nowrap;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,var(--meter-fill) var(--fill),var(--meter-base) var(--fill))}
#galaxybar-app-demo .gb-shortcuts .gb-meter {margin-inline:5.33px 1.33px}
#galaxybar-app-demo .gb-meter {--meter-base:#2c353d;--meter-fill:#265c42}
#galaxybar-app-demo :is(.gb-shortcuts,.gb-widget-preview) .gb-meter[data-fill=&quot;false&quot;] {background:var(--meter-base)}
#galaxybar-app-demo :is(.gb-shortcuts,.gb-widget-preview) .gb-meter[data-background=&quot;false&quot;] {background:none}
#galaxybar-app-demo .gb-meter[data-font=&quot;condensed&quot;] {font-family:&quot;Roboto Condensed&quot;,&quot;Arial Narrow&quot;,&quot;Segoe UI&quot;,sans-serif;letter-spacing:-.025em}
#galaxybar-app-demo .gb-meter[data-font=&quot;mono&quot;] {font-family:&quot;IBM Plex Mono&quot;,Consolas,monospace}
#galaxybar-app-demo .gb-widget-preview {display:flex;justify-content:center;align-items:center;min-height:46px;padding:6px;background:var(--gb-bg);border-radius:9px;margin-bottom:10px}
#galaxybar-app-demo .gb-widget-preview .gb-meter {min-height:28px;height:auto}
#galaxybar-app-demo .gb-widget-appearance {border-top:1px solid var(--gb-line);margin-top:10px;padding-top:2px}
#galaxybar-app-demo .gb-widget-appearance label:has(input:disabled) {opacity:.5}
#galaxybar-app-demo .gb-widget-font {display:flex;align-items:center;justify-content:space-between;gap:12px}
#galaxybar-app-demo .gb-widget-font select {max-width:68%;font:inherit;color:inherit}
#galaxybar-app-demo .gb-widget-size {display:grid;grid-template-columns:auto minmax(50px,1fr) 47px;align-items:center;gap:10px;min-height:42px}
#galaxybar-app-demo .gb-widget-size input {width:100%;accent-color:var(--gb-blue)}
#galaxybar-app-demo .gb-widget-size output {color:var(--gb-muted);text-align:right;font-variant-numeric:tabular-nums}
#galaxybar-app-demo .gb-meter-number {font-size:var(--meter-number-size,12px);line-height:1;font-variant-numeric:tabular-nums}
#galaxybar-app-demo .gb-meter.gb-engine {--meter-fill:#254d78}
#galaxybar-app-demo .gb-meter.gb-cabin {--cabin-cold:#215a91;--cabin-warm:#962f3d;--meter-fill:color-mix(in srgb,var(--cabin-cold),var(--cabin-warm) var(--fill))}
#galaxybar-app-demo[data-theme=&quot;light&quot;] .gb-meter {--meter-base:#e8edf2;--meter-fill:#bae5c8}
#galaxybar-app-demo[data-theme=&quot;light&quot;] .gb-meter.gb-engine {--meter-fill:#bedcfe}
#galaxybar-app-demo[data-theme=&quot;light&quot;] .gb-meter.gb-cabin {--cabin-cold:#b8dbf8;--cabin-warm:#f5b8ba;--meter-fill:color-mix(in srgb,var(--cabin-cold),var(--cabin-warm) var(--fill))}
#galaxybar-app-demo :is(.gb-shortcuts,.gb-widget-preview):not([data-style=&quot;0&quot;]) .gb-meter {--meter-fill:#434f5a}
#galaxybar-app-demo[data-theme=&quot;light&quot;] :is(.gb-shortcuts,.gb-widget-preview):not([data-style=&quot;0&quot;]) .gb-meter {--meter-fill:#d1d9e1}
#galaxybar-app-demo .gb-meter .gb-symbol {width:15px;height:15px;font-size:13px}
#galaxybar-app-demo .gb-meter .gb-symbol svg {width:14px;height:14px}
#galaxybar-app-demo .gb-meter-line,#galaxybar-app-demo .gb-meter-part {display:inline-flex;align-items:center;gap:3px}
#galaxybar-app-demo [data-rpm] {font-variant-numeric:tabular-nums}
#galaxybar-app-demo .gb-choice {display:flex;align-items:center;gap:10px;min-width:0;min-height:44px}
#galaxybar-app-demo .gb-widget-options {flex-wrap:wrap;column-gap:6px;row-gap:0}
#galaxybar-app-demo .gb-widget-help {flex:0 0 100%;padding:9px 12px;background:var(--gb-tile);border-radius:8px}
#galaxybar-app-demo .gb-ram {padding:10px 12px;background:var(--gb-tile);border-radius:8px}

#galaxybar-app-demo .gb-dialog[data-tasks] {max-width:350px;margin-inline:var(--task-left,8px) auto}
#galaxybar-app-demo .gb-pop .gb-row &gt; :last-child {text-align:right}
#galaxybar-app-demo .gb-shortcuts button[data-action=&quot;launch:tasks&quot;] {color:var(--gb-text)}
@container (max-width:470px) {
  #galaxybar-app-demo .gb-shortcuts {padding-left:0}
  #galaxybar-app-demo .gb-summary {gap:6px;flex-wrap:wrap}
}

#galaxybar-app-demo .gb-help-caption {display:inline-flex;align-items:center;gap:4px;max-width:100%}
#galaxybar-app-demo .gb-help-caption .gb-mini {flex:none}
#galaxybar-app-demo .gb-widget-options &gt; .gb-help-caption {gap:4px}
#galaxybar-app-demo .gb-help-caption h3 {margin:0}

#galaxybar-app-demo .gb-update-heading small {white-space:nowrap}

#galaxybar-app-demo .gb-update-caption .gb-mini {color:var(--gb-accent);padding:7px 0;white-space:nowrap}
#galaxybar-app-demo .gb-dialog[data-updates] {width:min(800px,calc(100% - 32px));padding:23px 25px 18px;max-height:620px}
#galaxybar-app-demo .gb-dialog[data-updates] &gt; h2 {font-size:22px;margin-bottom:18px}
#galaxybar-app-demo .gb-update-intro {display:flex;align-items:center;gap:15px;margin-bottom:18px}
#galaxybar-app-demo .gb-update-intro &gt; img {width:57px;height:57px;border-radius:10px;flex:none}
#galaxybar-app-demo .gb-update-intro &gt; div {display:grid;gap:5px}

#galaxybar-app-demo .gb-update-version small {font-size:12px;color:var(--gb-muted);margin-left:9px;font-weight:400}
#galaxybar-app-demo .gb-update-list {margin:12px 0 18px;padding-left:21px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 30px;font-size:15px;line-height:1.5}
#galaxybar-app-demo .gb-update-list li::marker {color:var(--gb-accent)}
#galaxybar-app-demo .gb-update-sources {display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:11px}
#galaxybar-app-demo .gb-update-sources .gb-control {min-height:49px;background:var(--gb-tile);font-size:15px}
#galaxybar-app-demo .gb-update-sources .gb-primary {background:var(--gb-blue);color:#fff}

#galaxybar-app-demo .gb-update-message {font-size:16px;line-height:1.5;margin:4px 0 20px}

 #galaxybar-app-demo [data-update-checking] &gt; svg {animation:gb-update-spin 1.2s linear infinite}

  const releases = [[&quot;1.63&quot;, &quot;20 ноября 2026&quot;, &quot;Дворники, ночной режим и диагностика&quot;, &quot;В «Штатные функции» добавлено сервисное положение передних дворников. Дворники и обогрев заднего стекла переключаются прямо в открытой папке.\n\nВ ночном режиме короткое нажатие показывает панели на 5 секунд. Повторный запуск возвращает на открытый экран, для выхода достаточно одного удержания. Доступен фон «Горизонт», на стоянке мощность показывается с десятыми долями кВт.\n\nВ отдельном разделе «Диагностика» видны разрешения и состояние службы автосдвига. Добавлены запрос доступных разрешений и справка.\n\n«Обучение» записывает отклик ГУ на действия штатными кнопками и собирает один TXT с замерами.&quot;], [&quot;1.6&quot;, &quot;18 ноября 2026&quot;, &quot;Ночной режим, данные автомобиля и обновления&quot;, &quot;Ночной режим доступен в общем списке функций без экспериментального доступа: скорость, обороты ДВС, музыка и четырьмя блоками данных автомобиля. Через карандаш настраиваются яркость с шагом 10% и видимость показателей. Для выхода удерживайте экран 1 секунду. В электрорежиме правый круг показывает мощность тяговой батареи: потребление и возврат энергии. Можно выбрать полный экран, скрытие только верхней штатной панели и отдельно скрыть GalaxyBar.\n\nМощность в кВт добавлена в попап батареи и отдельным показателем в настройки её виджета.\n\nДобавлен виджет температуры и влажности салона. В попапе батареи видно напряжение 12-вольтовой АКБ. В папках можно менять размер плиток и количество столбцов.\n\nВ разделе «Сервисные данные» показания собраны по группам: тяговая батарея, АКБ 12 В, ДВС и топливо, движение и пробег, климат и расчёты GalaxyBar. Прогнозы сравниваются со штатными.\n\nВерхняя панель вмещает больше ярлыков и плавно сдвигается при появлении штатных значков.\n\nДобавлена проверка опубликованных обновлений с переходом в Telegram или SnickPro Store. «Пропустить релиз» скрывает автоматическое предложение этой версии до следующего публичного обновления.&quot;], [&quot;1.54&quot;, &quot;17 ноября 2026&quot;, &quot;Диагностика и оформление виджетов&quot;, &quot;В «О программе» появилась диагностика ГУ с экспортом отчёта о прошивке, разрешениях и доступности данных автомобиля.\n\nУ каждого виджета можно настроить шрифт, размер цифр до 24, единицы измерения, фон и заливку. Для ДВС доступен выбор «об/мин» или «RPM». Результат виден в предпросмотре.\n\nТап по другому значку сразу переключает окна, включая диспетчер задач. История релизов доступна внизу раздела «О программе».&quot;], [&quot;1.51&quot;, &quot;16 ноября 2026&quot;, &quot;Прогноз запаса хода&quot;, &quot;Сначала виджет ДВС показывает штатный прогноз. GalaxyBar постепенно уточняет его, а после 60 км учтённого пробега прогноз полностью опирается на фактический расход.\n\nДля первого расчёта нужно суммарно 15 км гибридных участков. Короткие паузы ДВС учитываются, отдельные поездки на электротяге исключаются. Заправка сохраняет историю.\n\nС разрешением Android объём топлива берётся из ГУ. Он используется для расхода, прогноза, литража и свободного места в баке. Если данных нет, используется процент.\n\nИсправлено зависание статистики EV на первых километрах. Расчёт допускает небольшие расхождения одометров и кратковременный рост заряда при рекуперации.&quot;], [&quot;1.46&quot;, &quot;16 ноября 2026&quot;, &quot;Виджет ДВС и управление сиденьями&quot;, &quot;Добавлен виджет ДВС с оборотами, температурой антифриза, топливом в литрах и прогнозом по расходу. Виджет можно скрывать при заглушённом двигателе, а заливку привязать к уровню топлива или оборотам.\n\nВ попапе ДВС видны расход, учтённый пробег и свободное место в баке. В попапе батареи появились остаток заряда и свободная ёмкость в кВт·ч.\n\nДля подогрева, вентиляции и массажа сидений можно выбрать порядок уровней 0 → 1 → 2 → 3 или штатный 0 → 3 → 2 → 1.&quot;]];

  function render() {

    root.style.setProperty(&#x27;--gb-scale&#x27;,1+(state.scale-2)*.08);
    updateBar();
    nav.innerHTML=sections.map(([title,name,fallback],i)=&gt;{
      return &#x27;&lt;button type=&quot;button&quot; data-action=&quot;section:&#x27;+i+&#x27;&quot;&#x27;+(i===state.section?&#x27; aria-current=&quot;page&quot;&#x27;:&#x27;&#x27;)+&#x27;&gt;&#x27;+
        glyph(name,fallback)+escape(title)+&#x27;&lt;/button&gt;&#x27;;
    }).join(&#x27;&#x27;);
    main.innerHTML=&#x27;&lt;h2&gt;&#x27;+sections[state.section][0]+&#x27;&lt;/h2&gt;&#x27;+screens[state.section]();

  function showPopup(trigger,title,body,grid=false,telemetry=false,hint=false,folder=null) {
    const same=popupTrigger===trigger;
    closePopup();
    if(same) return;
    popupTrigger=trigger;
    trigger.setAttribute(&#x27;aria-expanded&#x27;,&#x27;true&#x27;);
    pop.classList.toggle(&#x27;gb-grid&#x27;,grid);
    pop.classList.toggle(&#x27;gb-ev&#x27;,telemetry);
    pop.classList.toggle(&#x27;gb-hint&#x27;,hint);
    pop.setAttribute(&#x27;role&#x27;,hint?&#x27;status&#x27;:&#x27;region&#x27;);
    pop.innerHTML=hint ? body : &#x27;&lt;h2&gt;&#x27;+escape(title)+&#x27;&lt;/h2&gt;&#x27;+body;
    pop.style.width=&#x27;&#x27;;
    pop.style.maxHeight=&#x27;&#x27;;
    pop.style.removeProperty(&#x27;--folder-columns&#x27;);
    pop.style.removeProperty(&#x27;--folder-tile-height&#x27;);
    pop.style.removeProperty(&#x27;--folder-icon-size&#x27;);
    if(grid &amp;&amp; folder) {
      const size=folder.tileSize ?? 1;
      const columns=folder.columns ?? 3;
      const tileWidth=folder.items.some(key=&gt;vehicleKeys.includes(key))?112:96;
      pop.style.width=(32+columns*(tileWidth+size*16)+(columns-1)*6)*2/3+&#x27;px&#x27;;
      pop.style.setProperty(&#x27;--folder-columns&#x27;,columns);
      pop.style.setProperty(&#x27;--folder-tile-height&#x27;,(80+size*16)*2/3+&#x27;px&#x27;);
      pop.style.setProperty(&#x27;--folder-icon-size&#x27;,(32+size*8)*2/3+&#x27;px&#x27;);
    }
    pop.classList.toggle(&#x27;gb-forecast-panel&#x27;, Boolean(pop.querySelector(&#x27;.gb-forecast&#x27;)));
    pop.hidden=false;
    const frame=root.getBoundingClientRect(), anchor=trigger.getBoundingClientRect(), zoom=scale();
    if(telemetry){
      const bottom=root.querySelector(&#x27;.gb-dock&#x27;).offsetTop;
      const top=(anchor.bottom-frame.top)/zoom+7;
      pop.style.maxHeight=Math.min(580,Math.max(120,bottom-top-8))+&#x27;px&#x27;;
    }
    const x=(anchor.left-frame.left)/zoom;
    const left=hint ? x : x+(anchor.width/zoom-pop.offsetWidth)/2;
    pop.style.left=Math.max(8,Math.min(left,frame.width/zoom-pop.offsetWidth-8))+&#x27;px&#x27;;
    const above=(anchor.top-frame.top)/zoom-pop.offsetHeight-7;
    pop.style.top=(hint&amp;&amp;above&gt;=8 ? above : (anchor.bottom-frame.top)/zoom+7)+&#x27;px&#x27;;
    refreshIcons();
  }
